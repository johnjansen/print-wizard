<!doctype html><html><head><meta charset=utf-8>
<title>polyslice test</title>
<script type="importmap">
{ "imports": {
  "three": "https://esm.sh/three@0.183.2",
  "three/addons/": "https://esm.sh/three@0.183.2/examples/jsm/",
  "@jgphilpott/polyslice": "https://unpkg.com/@jgphilpott/polyslice/dist/index.browser.esm.js"
}}
</script>
</head><body>
<pre id="out">loading…</pre>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;  // Polyslice's browser bundle reads window.THREE
import Polyslice from '@jgphilpott/polyslice';
try {
  const Printer = Polyslice.Printer, Filament = Polyslice.Filament;
  const sl = new Polyslice({ printer: new Printer('Ender3'), filament: new Filament('GenericPLA'), nozzleTemperature:210, bedTemperature:70, infillDensity:20, autohome:false });
  const cube = new THREE.Mesh(new THREE.BoxGeometry(10,10,10), new THREE.MeshBasicMaterial());
  const gcode = sl.slice(cube);
  document.getElementById('out').textContent = 'OK gcode length=' + gcode.length + '\n--- head ---\n' + gcode.slice(0,500);
  window.__ok = true; window.__len = gcode.length;
} catch(e) {
  document.getElementById('out').textContent = 'ERROR: ' + e.message + '\n' + (e.stack||'');
  window.__err = e.message;
}
</script></body></html>
